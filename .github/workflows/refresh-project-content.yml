name: Refresh project content (build only)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      README_SYNC_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:readme-sync
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-portfolio-preview
          path: |
            build/
            src/components/projectReadmes.json
          retention-days: 7
