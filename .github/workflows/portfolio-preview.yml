name: Portfolio preview (build only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: |
            build/
          retention-days: 7
